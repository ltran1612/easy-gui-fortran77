# total download: 141.8 MB

# What to keep when pruning. A keep-list rather than a drop-list: if a future GCC
# moves something we need, the build breaks loudly in the smoke test instead of
# silently shipping a toolchain that cannot link.
#
# `*` matches any sequence, including `/`.
#
# Validated at 566 MB -> 118 MB with the whole corpus still passing, and a clean
# Debian container with no gcc, ld or gfortran. Re-run both after changing this.
[prune]
keep = [
  "bundle.toml",

  # driver and binutils
  "bin/*-gfortran",
  "bin/*-as",
  "bin/*-ld",
  "bin/*-ar",
  "bin/*-ranlib",
  "*/bin/*",              # <triplet>/bin tool links, GCC's tooldir
  "*/lib/ldscripts/*",    # ld will not link without these

  # the Fortran front end and the link wrapper. cc1, cc1obj, cc1objplus and lto1
  # are ~180 MB and are NOT needed: f951 has an integrated preprocessor, so even
  # `.F` sources compile without cc1 (verified in a container with nothing else).
  "libexec/gcc/*/*/f951",
  "libexec/gcc/*/*/collect2",
  "libexec/gcc/*/*/ld",

  # startup files, runtime archives, specs, intrinsic modules
  "lib/gcc/*/*/*.o",
  "lib/gcc/*/*/libgcc.a",
  "lib/gcc/*/*/libgcc_eh.a",
  "lib/gcc/*/*/libatomic*",   # the specs link -latomic_asneeded
  "lib/gcc/*/*/libgfortran.a",
  "lib/gcc/*/*/libquadmath.a",
  "lib/gcc/*/*/libgcc_s.so*",
  "lib/gcc/*/*/libgfortran.so*",
  "lib/gcc/*/*/libquadmath.so*",
  "lib/gcc/*/*/specs",
  "lib/gcc/*/*/*.specs",
  "lib/gcc/*/*/*.spec",
  "lib/gcc/*/*/finclude/*",

  # shared runtimes the above symlink to, plus what as and ld load
  "lib/libgfortran.so*",
  "lib/libquadmath.so*",
  "lib/libgcc_s.so*",
  "lib/libzstd.so*",

  # the sysroot: crt objects, libc.a and the rest of glibc
  "*/sysroot/usr/lib64/*",
  "*/sysroot/lib64/*",

  # GPL compliance travels with the binaries
  "share/licenses/*",
]

# Applied after `keep`, so a directory can be kept wholesale minus its junk.
drop = [
  "*/locale/*",        # locale-archive.tmpl alone is 102 MB
  "*/locale-archive*",
]

# ---------------------------------------------------------------------------
# GPLv3 §6: Corresponding Source.
#
# Redistributing GCC and binutils binaries obliges us to make their source
# available from the same place as the binaries, for as long as we distribute
# them. conda-forge does not host source tarballs next to its packages, so
# pointing at conda-forge would not discharge the obligation -- we mirror it.
#
# §1 says Corresponding Source includes "scripts to control those activities",
# so the feedstock recipes and their patches are part of it, not an extra.
# conda-forge patches GCC, so the upstream tarball alone is not sufficient.
#
# Checksums are conda-forge's own, taken from the feedstock recipes that built
# the binaries we ship, which is what makes them the right ones.

[[source]]
component = "gcc"
version = "16.2.0"
url = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.gz"
sha256 = "071d00a097579e5ef7ce97fc4a9e58e73fd3503c0a013c765c970370a5a53b9b"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
covers = ["gcc_impl_linux-64", "gfortran_impl_linux-64", "libgcc-devel_linux-64", "libgcc", "libgfortran5", "libstdcxx"]

[[source]]
component = "binutils"
version = "2.46.1"
url = "https://ftp.gnu.org/gnu/binutils/binutils-2.46.1.tar.bz2"
sha256 = "324ed40ada2633a28eaa5d104ca5db165fd3cc3162cc1d48a7b7fa9c932da439"
license = "GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-3.0-or-later AND LGPL-2.0-or-later"
covers = ["binutils_impl_linux-64", "ld_impl_linux-64"]

[[source]]
