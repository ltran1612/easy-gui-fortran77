# Windows x86_64 toolchain recipe.
#
# conda-forge publishes a MinGW-w64/UCRT gfortran in the *same package format* as
# the Linux one, so one fetch pipeline serves both platforms: one prune format,
# one integrity manifest, one GPL source-mirroring job.
#
# The package set is the dependency closure of gfortran_impl_win-64 and
# binutils_impl_win-64, resolved from conda-forge repodata rather than by hand.
# Two things that closure caught which guessing did not: ld_impl_win-64 is a
# package of its own (the same trap that cost a container test on Linux), and the
# mingw-w64 CRT arrives via m2w64-sysroot_win-64 -> mingw-w64-ucrt-x86_64-crt-git.
# A first attempt filtered out anything named m2w64* as MSYS2 shell tooling and
# ended up with no crt2.o at all, which would have failed every link.
#
# Excluded from the closure on purpose: intel-openmp, libgomp and _openmp_mutex
# (we never pass -fopenmp) and libstdcxx-devel_win-64 (C++ headers; no C++
# compiler ships).
#
# Validation status: exercised under wine, not on Windows.
#
# `toolchain/verify-under-wine.sh` builds and runs the whole Fortran corpus with
# this bundle, and all fifteen cases pass -- including static linking, stripping,
# DEC extensions and static local storage. wine is not Windows, so that is
# evidence rather than proof, and the windows-latest CI job remains the real gate.
#
# It is worth the trouble: it found two bugs the day it was set up. The build
# looked for `program` where MinGW's linker writes `program.exe`, because the
# suffix came from the host rather than the bundle's target; and the launcher was
# resolved against the child's scrubbed PATH, where nothing could ever find it.
# Both would otherwise have surfaced as a confusing CI failure at best.

target = "x86_64-pc-windows-gnu"
triplet = "x86_64-w64-mingw32"
gcc_version = "16.2.0"
channel = "https://conda.anaconda.org/conda-forge"
bundle_template = "windows-x86_64.bundle.toml"

