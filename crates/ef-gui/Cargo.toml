[package]
name = "ef-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Easy Fortran 77 — the application window."

[[bin]]
name = "easy-fortran-77"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ef-core.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36.2"
rfd = "0.15"
crossbeam-channel.workspace = true
sys-locale.workspace = true
opener.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fontdb = "0.24.0"
ttf-parser = "0.25"

[dev-dependencies]
ttf-parser = "0.25"
ef-core.workspace = true

# Embeds the icon as a Windows resource, so easy-fortran-77.exe carries it in
# Explorer and on the taskbar. Windows targets only; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies.png]
# Decoding one small icon at startup. The default feature set adds compression
# backends this never uses.
version = "0.18"
default-features = false
