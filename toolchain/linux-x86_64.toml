# Linux x86_64 toolchain recipe.
#
# Pinned conda-forge packages, verified by SHA-256. Chosen because the tree is
# relocatable by construction (GCC is configured --with-sysroot under --prefix,
# so TARGET_SYSTEM_ROOT_RELOCATABLE applies) and because sysroot_linux-64 ships
# glibc-static, which is what lets produced programs be linked fully static and
# so run on any x86-64 Linux regardless of its glibc.
#
# glibc 2.17 is the portability floor: every distro released since mid-2014 has
# at least that, and it is the same baseline as manylinux2014.
#
# Validated end to end on 2026-09-19 -- see README.md in this directory.

target = "x86_64-unknown-linux-gnu"
triplet = "x86_64-conda-linux-gnu"
gcc_version = "16.2.0"
channel = "https://conda.anaconda.org/conda-forge"
bundle_template = "linux-x86_64.bundle.toml"

