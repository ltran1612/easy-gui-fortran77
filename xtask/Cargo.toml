[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository chores: hygiene checks, toolchain pruning, manifests."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
flate2 = "1.1.10"
# PNG only: the default feature set pulls in a codec for every format there is,
# and this reads one file.
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tar = "0.4.46"
toml.workspace = true
ureq = "3.4.2"
zip = "8.6.0"
zstd = "0.14.0"
