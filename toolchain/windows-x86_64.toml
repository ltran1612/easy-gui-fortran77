# total download: 116.8 MB

# Mirrors the Linux keep-list, adapted to the conda Windows layout: win-64
# packages install under `Library/`, noarch ones at the root, which is why
# `lib/gcc/...` appears twice below. The bundle descriptor passes -B for both.
[prune]
keep = [
  "bundle.toml",

  # driver, binutils and the DLLs they and the produced programs load
  "Library/bin/*-gfortran.exe",
  "Library/bin/*.dll",
  "Library/*/bin/as.exe",
  "Library/*/bin/ld.exe",

  # the Fortran front end and the link wrapper. cc1, cc1obj, cc1objplus and lto1
  # are ~170 MB and unreachable: f951 has an integrated preprocessor.
  "Library/libexec/gcc/*/*/f951.exe",
  "Library/libexec/gcc/*/*/collect2.exe",

  # startup files, runtime archives, specs, intrinsic modules
  "Library/lib/gcc/*/*/*.o",
  "Library/lib/gcc/*/*/libgfortran.a",
  "Library/lib/gcc/*/*/libgfortran.dll.a",
  "Library/lib/gcc/*/*/libquadmath.a",
  "Library/lib/gcc/*/*/libquadmath.dll.a",
  "Library/lib/gcc/*/*/libatomic.a",
  "Library/lib/gcc/*/*/libatomic.dll.a",
  "Library/lib/gcc/*/*/specs",
  "Library/lib/gcc/*/*/*.specs",
  "Library/lib/gcc/*/*/*.spec",
  "Library/lib/gcc/*/*/finclude/*",

  # libgcc-devel is a noarch package, so it lands at the root rather than under
  # Library/. Kept where it falls; the bundle passes -B for it.
  "lib/gcc/*/*/*.o",
  "lib/gcc/*/*/libgcc.a",
  "lib/gcc/*/*/libgcc_eh.a",
  "lib/gcc/*/*/libgcc_s.a",

  # ld's linker scripts
  "Library/*/lib/ldscripts/*",

  # The mingw-w64 CRT sysroot, named file by file rather than wholesale. The
  # directory is 82 MB, almost all of it import libraries for Windows API
  # surfaces a Fortran program never touches (OneCore, WindowsApp, nanoserver).
  #
  # The first ten entries are not a guess: they are what `ld -t` reported opening
  # across every corpus program and four link variants (static, dynamic,
  # stripped, large-stack). The rest is margin -- everything the spec file names
  # on a conditional path, plus the classic Win32 import libraries a legacy
  # program might name itself through the advanced "extra flags" box. 82 MB down
  # to 18 MB.
  "*/sysroot/usr/lib/crt2.o",
  "*/sysroot/usr/lib/default-manifest.o",
  "*/sysroot/usr/lib/libadvapi32.a",
  "*/sysroot/usr/lib/libkernel32.a",
  "*/sysroot/usr/lib/libm.a",
  "*/sysroot/usr/lib/libmingw32.a",
  "*/sysroot/usr/lib/libmingwex.a",
  "*/sysroot/usr/lib/libmsvcrt.a",
  "*/sysroot/usr/lib/libshell32.a",
  "*/sysroot/usr/lib/libuser32.a",

  # Named by the spec file on paths our corpus does not take.
  "*/sysroot/usr/lib/crt1.o",
  "*/sysroot/usr/lib/dllcrt2.o",
  "*/sysroot/usr/lib/crtbegin.o",
  "*/sysroot/usr/lib/crtend.o",
  "*/sysroot/usr/lib/libmingwthrd.a",
  "*/sysroot/usr/lib/libmoldname.a",
  "*/sysroot/usr/lib/libpthread.a",
  "*/sysroot/usr/lib/libwinpthread.a",
  "*/sysroot/usr/lib/libgdi32.a",
  "*/sysroot/usr/lib/libcomdlg32.a",
  "*/sysroot/usr/lib/libpsapi.a",
  "*/sysroot/usr/lib/libucrt.a",
  "*/sysroot/usr/lib/libucrtbase.a",
  "*/sysroot/usr/lib/libmsvcrt-os.a",
  "*/sysroot/usr/lib/libssp.a",

  # A 1980s program that calls the Windows API directly names these itself.
  "*/sysroot/usr/lib/libws2_32.a",
  "*/sysroot/usr/lib/libole32.a",
  "*/sysroot/usr/lib/liboleaut32.a",
  "*/sysroot/usr/lib/libuuid.a",
  "*/sysroot/usr/lib/libcomctl32.a",
  "*/sysroot/usr/lib/libwinspool.a",
  "*/sysroot/usr/lib/libodbc32.a",
  "*/sysroot/usr/lib/libwinmm.a",
  "*/sysroot/usr/lib/libversion.a",
  "*/sysroot/usr/lib/libshlwapi.a",

  # GPL compliance travels with the binaries
  "Library/share/licenses/*",
]

drop = [
  # GCC plugin support: cc1.exe.a / cc1plus.exe.a, ~70 MB
  "*/plugin/*",

  # Nothing in the toolchain imports libstdc++, verified by reading the PE import
  # tables of the driver, f951, collect2, as and ld. No C++ is compiled either.
  "*/libstdc++-6.dll",

]

# ---------------------------------------------------------------------------
# Corresponding Source (GPLv3 §6)
#
# Shipping GCC and binutils binaries obliges us to offer their source from the
# same place, for as long as we distribute them. conda-forge does not host
# tarballs next to its packages, so citing conda-forge would not discharge it:
# we mirror, and the release workflow publishes the result as an asset on the
# same GitHub Release as the installer.
#
# The GCC and binutils tarballs are the same upstream files the Linux recipe
# names, at the same versions and with the same checksums — the toolchains are
# cross-built from identical sources and differ only in their target.
# ---------------------------------------------------------------------------

