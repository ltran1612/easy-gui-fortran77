license = "GPL-3.0-or-later WITH GCC-exception-3.1"
covers = [
    "gcc_impl_win-64",
    "gfortran_impl_win-64",
    "libgcc-devel_win-64",
    "libgcc",
    "libgfortran5",
    "libstdcxx",
]

