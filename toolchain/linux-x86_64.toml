note = "The sysroot is repackaged from CentOS 7.9 binary RPMs; this is the matching source RPM."

[[source]]
component = "conda-forge build recipes"
version = "ctng-compilers, binutils, linux-sysroot feedstocks"
url = "https://github.com/conda-forge/ctng-compilers-feedstock"
license = "BSD-3-Clause (recipes); the patches carry the licence of what they patch"
covers = ["all"]
note = "The build scripts and patches. GPLv3 §1 counts these as Corresponding Source, and conda-forge patches GCC, so the upstream tarball alone is not enough. Archive at the exact commit that built the shipped binaries."
